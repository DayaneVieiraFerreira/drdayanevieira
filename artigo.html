<script>

  const SUPABASE_URL =
    'https://pizpvlksxubvlkmyfvbh.supabase.co';


  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_2-QUMkZ34aJEG_6ti-qkpg_uGPWYQj8';


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const loading =
    document.getElementById('loading');

  const articleContainer =
    document.getElementById(
      'article-container'
    );

  const errorArea =
    document.getElementById(
      'error-area'
    );

  const articleMeta =
    document.getElementById(
      'article-meta'
    );

  const articleTitle =
    document.getElementById(
      'article-title'
    );

  const articleSummary =
    document.getElementById(
      'article-summary'
    );

  const articleBody =
    document.getElementById(
      'article-body'
    );


  function escapeHtml(value) {

    return String(value ?? '')

      .replaceAll('&', '&amp;')

      .replaceAll('<', '&lt;')

      .replaceAll('>', '&gt;')

      .replaceAll('"', '&quot;')

      .replaceAll(
        "'",
        '&#039;'
      );

  }


  function formatarConteudo(texto) {

    const textoSeguro =
      escapeHtml(texto);


    const blocos =
      textoSeguro
        .split(/\n\s*\n/)
        .filter(
          bloco =>
            bloco.trim() !== ''
        );


    return blocos.map(bloco => {

      const linhas =
        bloco.split('\n');


      /*
       * TÍTULO:
       * ## Nome da seção
       */

      if (
        linhas.length === 1 &&
        linhas[0].startsWith('## ')
      ) {

        return `
          <h2>
            ${linhas[0].substring(3)}
          </h2>
        `;

      }


      /*
       * DESTAQUE:
       * IMPORTANTE:
       */

      if (
        linhas[0]
          .toUpperCase()
          .startsWith('IMPORTANTE:')
      ) {

        return `
          <div class="important">
            ${linhas.join('<br>')}
          </div>
        `;

      }


      /*
       * LISTAS
       */

      if (
        linhas.every(
          linha =>
            linha.trim()
              .startsWith('- ')
        )
      ) {

        const itens =
          linhas.map(linha => `

            <li>
              ${
                linha
                  .trim()
                  .substring(2)
              }
            </li>

          `).join('');


        return `
          <ul>
            ${itens}
          </ul>
        `;

      }


      /*
       * PARÁGRAFO NORMAL
       */

      return `
        <p>
          ${linhas.join('<br>')}
        </p>
      `;

    }).join('');

  }


  function mostrarErro() {

    loading.style.display =
      'none';

    articleContainer.style.display =
      'none';

    errorArea.style.display =
      'block';

  }


  async function carregarArtigo() {

    /*
     * PRIMEIRO:
     * VERIFICAR LOGIN
     */

    const { data: sessionData } =
      await supabaseClient.auth
        .getSession();


    if (!sessionData.session) {

      window.location.href =
        'pacientes.html';

      return;

    }


    /*
     * PEGAR ID DA URL
     *
     * Exemplo:
     * artigo.html?id=1
     */

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const id =
      parametros.get('id');


    if (!id) {

      mostrarErro();

      return;

    }


    /*
     * BUSCAR ARTIGO
     */

    const {
      data,
      error
    } =
      await supabaseClient

        .from('conteudos')

        .select(`
          id,
          categoria,
          titulo,
          faixa_etaria,
          resumo,
          conteudo
        `)

        .eq(
          'id',
          id
        )

        .eq(
          'publicado',
          true
        )

        .single();


    if (error || !data) {

      console.error(
        'Erro ao carregar artigo:',
        error
      );

      mostrarErro();

      return;

    }


    /*
     * PREENCHER A PÁGINA
     */

    articleMeta.textContent =
      data.categoria +
      (
        data.faixa_etaria
          ? ' · ' +
            data.faixa_etaria
          : ''
      );


    articleTitle.textContent =
      data.titulo;


    articleSummary.textContent =
      data.resumo || '';


    let conteudoFormatado =
      formatarConteudo(
        data.conteudo
      );

    articleBody.innerHTML =
      conteudoFormatado;


    loading.style.display =
      'none';


    articleContainer.style.display =
      'block';

  }


  carregarArtigo();

</script>
